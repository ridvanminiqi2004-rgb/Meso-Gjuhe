function auth(m){scr=()=>auth(m);const t=T(),r=m=="reg";shell(`${LG}<div class=card><input id=f placeholder="${t.first}" autocomplete=given-name><input id=l placeholder="${t.last}" autocomplete=family-name>${r?`<input id=e type=email placeholder="${t.email}" autocomplete=email>`:""}<input id=p type=password placeholder="${t.pass}" autocomplete="${r?"new-password":"current-password"}"><div class=msg id=m></div><button class=btn onclick="${r?"reg()":"login()"}">${r?t.reg:t.login}</button><button class="btn g" onclick="auth('${r?"login":"reg"}')">${r?t.haveacc:t.noacc}</button></div>`,1)}
const v=i=>$("#"+i).value.trim(),msg=x=>$("#m").textContent=x;
async function reg(){const t=T(),f=v("f"),l=v("l"),e=v("e"),p=v("p");if(!f||!l||!e||!p)return msg(t.fill);if(!/^\S+@\S+\.\S+$/.test(e))return msg(t.bademail);if(users()[uid(f,l)])return msg(t.exists);pend={f,l,e,h:await H(p),code:String(Math.floor(100000+Math.random()*900000))};ver()}
function ver(){scr=ver;const t=T();shell(`${LG}<div class=card><div class=note>${t.sent} <b>${pend.code}</b></div><small>${E(pend.e)}</small><input id=c inputmode=numeric maxlength=6 placeholder="${t.code}"><div class=msg id=m></div><button class=btn onclick="chk()">${t.verify}</button></div>`,1)}
function chk(){if(v("c")!==pend.code)return msg(T().wrong);const u=users();u[uid(pend.f,pend.l)]={f:pend.f,l:pend.l,e:pend.e,h:pend.h,v:1};sv("mg_users",u);cur=uid(pend.f,pend.l);sv("mg_cur",cur);pend=null;L=null;home()}
async function login(){const t=T(),f=v("f"),l=v("l"),p=v("p");if(!f||!l||!p)return msg(t.fill);const u=users()[uid(f,l)];if(!u||u.h!==await H(p))return msg(t.bad);cur=uid(f,l);sv("mg_cur",cur);L=ld("mg_L_"+cur);home()}
function out(){cur=null;L=null;sv("mg_cur",null);auth("login")}
function setSP(x){sv("mg_sp_"+cur,x);SP=x;if(L===x){L=null;sv("mg_L_"+cur,null)}home()}
function pickL(l){L=l;sv("mg_L_"+cur,l);home()}
function home(){scr=home;SP=ld("mg_sp_"+cur)||ui;if(L===SP)L=null;const t=T(),u=users()[cur];if(!u)return auth("login");let h=`${LG}<p>${t.hello}, <b>${E(u.f)}</b>!</p><div class=card><div class=row><b>${t.ispeak}</b><span>${["en","sq"].map(x=>`<button class=pill style="${x==SP?"background:var(--br);color:#fff":""}" onclick="setSP('${x}')">${x=="en"?"English":"Shqip"}</button>`).join(" ")}</span></div></div>`;
if(!L)h+=`<div class=card><b>${t.pick}</b>${["de","en","hr","sq"].filter(l=>l!=SP).map(l=>`<button class=btn onclick="pickL('${l}')">${FL[l]} ${t.iwant} ${t.ln[l]}</button>`).join("")}</div>`;
else{const s=(ld("mg_p_"+cur)||{})[L]||[],n=s.filter(x=>x!=null).length,pts=Math.round(s.reduce((a,b)=>a+(b||0),0)/25*100);
h+=`<div class=card><div class=sc>${pts}/100</div><div class=row><b>${t.final}</b><small>${n}/5 ${t.done}</small></div></div><div class=card><b>${FL[L]} ${t.ln[L]}</b>`+TT[L].map((x,i)=>`<div class=row style="padding:10px 0;border-top:1px solid var(--bd)"><div><b>${x}</b><br><small>${t.tt[i]} · ${s[i]==null?t.todo:s[i]+"/5"}</small></div><button class=pill onclick="go(${i})">${s[i]==null?t.start:t.retry}</button></div>`).join("")+`<button class="btn g" onclick="L=null;home()">${t.chg}</button></div>`}
shell(h+`<button class="btn g" onclick="out()">${t.out}</button>`)}
function build(l,t){const mc=(p,list,i,x)=>{const a=list[i];return{p,a,o:sh([a,...sh(list.filter((_,j)=>j!=i)).slice(0,3)]),...x}},ix=(n,k)=>sh([...Array(n).keys()]).slice(0,k);
if(t==0)return sh(B[l].map((r,i)=>({p:B[SP][i][0],a:r[1],o:sh(r.slice(1))})));
if(t==3)return sh(G[l].map((r,i)=>({p:GP[l][SP][i],a:r[1],o:sh(r.slice(1))})));
if(t==1)return ix(10,5).map(i=>mc(P.n[SP],V.n[l],i,{s:String(i+1)}));
if(t==4)return ix(10,5).map(i=>mc(P.c[SP],V.c[l],i,{c:HX[i]}));
return[...ix(7,3).map(i=>mc(P.d[SP](i+1),V.d[l],i)),...ix(12,2).map(i=>mc(P.m[SP](i+1),V.m[l],i))]}
function go(t){qz={t,i:0,r:0,lock:0,q:build(L,t)};qs()}
function quit(){clearInterval(tm);speechSynthesis&&speechSynthesis.cancel();document.body.className="";home()}
function qs(){clearInterval(tm);document.body.className="";qz.lock=0;qz.left=20;const q=qz.q[qz.i];
$("#app").innerHTML=`<div class=top><button class=pill onclick="quit()">←</button><b>${TT[L][qz.t]}</b><span>${qz.i+1}/5</span></div><div class=tbar><i id=tb></i></div><div class=row><small>${IN[SP]}</small><b id=tl>20</b></div><div class=card><div class=row><b>${E(q.p)}</b><button class=pill onclick="say(qz.q[qz.i].p,CODE[SP])">🔊</button></div>${q.c?`<div class=sw style="background:${q.c}"></div>`:q.s?`<div class=big>${E(q.s)}</div>`:""}</div>${q.o.map((o,k)=>`<button class=opt onclick="ans(${k})">${E(o)}</button>`).join("")}`;
setTimeout(()=>{const b=$("#tb");if(b){b.style.transition="width 20s linear";b.style.width="0"}},60);

tm=setInterval(()=>{qz.left--;$("#tl").textContent=qz.left;if(qz.left<=0){clearInterval(tm);ans(-1)}},1000)}
function ans(k){if(qz.lock)return;qz.lock=1;clearInterval(tm);const q=qz.q[qz.i],bs=document.querySelectorAll(".opt"),ci=q.o.indexOf(q.a),b=$("#tb");
b.style.width=getComputedStyle(b).width;b.style.transition="none";
if(k==ci){qz.r++;document.body.className="ok"}else{if(k>=0)bs[k].classList.add("no");document.body.className="no"}
bs[ci].classList.add("ok");say(q.a);setTimeout(()=>{qz.i++;qz.i<5?qs():fin()},k<0?2800:1800)}
function fin(){document.body.className="";const t=T(),p=ld("mg_p_"+cur)||{};p[L]=p[L]||[];p[L][qz.t]=qz.r;sv("mg_p_"+cur,p);
$("#app").innerHTML=`<div class=card><b>${TT[L][qz.t]}</b><div class=sc>${qz.r}/5</div><p class=mu style="text-align:center">${t.res}</p><button class=btn onclick="go(${qz.t})">${t.retry}</button><button class="btn g" onclick="home()">${t.home}</button></div>`}
if(cur&&users()[cur]){L=ld("mg_L_"+cur);home()}else auth("login");
</script></body></html>
